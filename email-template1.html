<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이메일 인증</title>
</head>

<body style="margin:0; padding:0; background-color:#0f0f0f;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0f0f0f;">
    <tr>
        <td align="center" style="padding:40px 20px;">

            <!-- 메인 카드 -->
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#1a1a1a; border-radius:16px; width:600px;">

                <!-- Header -->
                <tr>
                    <td align="center" style="padding:48px 48px 32px 48px;">
                        <img src="https://github.com/sunnyday0206/setting-file/blob/main/LOGddO.png?raw=true"
                             alt="Logo"
                             width="64"
                             height="64"
                             style="display:block; margin-bottom:24px;" />

                        <div style="font-size:28px; font-weight:700; color:#ffffff;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
                            이메일 인증
                        </div>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding:0 48px 48px 48px;">

                        <div style="font-size:16px; line-height:24px; color:#a0a0a0; text-align:center; margin-bottom:40px;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
                            아래 인증 코드를 입력하여 이메일 인증을 완료해주세요.
                        </div>

                        <!-- 인증코드 -->
                        <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"
                               style="background-color:#6FD89C; border-radius:16px;">
                            <tr>
                                <td align="center" style="padding:32px 56px;">
                                    <div style="font-size:48px; font-weight:800; letter-spacing:6px; color:#0f0f0f;
                        font-family:Courier, monospace;">
                                        183749
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <!-- 유효시간 -->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:40px;">
                            <tr>
                                <td align="center"
                                    style="background-color:#252525; border-radius:12px; padding:20px;">
                                    <div style="font-size:14px; color:#808080;
                        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
                                        이 코드는 <span style="color:#6FD89C; font-weight:600;">5분간</span> 유효합니다
                                    </div>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center"
                        style="padding:32px 48px 48px 48px; border-top:1px solid #2a2a2a;">
                        <div style="font-size:13px; color:#666666;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
                            본인이 요청하지 않으셨다면 이 메일을 무시하세요
                        </div>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
